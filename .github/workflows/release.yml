name: Publish release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Set package versions from release tag
        id: version
        run: |
          RELEASE_PRERELEASE=$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)
          export RELEASE_PRERELEASE
          node scripts/prepare-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build packages and run publishing preparation
        run: |
          # Visualization addons import Wunderbaum, which sorts after them in workspace order.
          npx --no-install tsc --build packages/web-component-designer-widgets-wunderbaum
          npm run prepublishOnly --workspaces --if-present

      - name: Pack all public workspaces
        run: |
          mkdir release-packages
          npm pack --workspaces --pack-destination "$PWD/release-packages"

      - name: Attach npm packages to the release
        run: gh release upload "$RELEASE_TAG" release-packages/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish packaged files to npm
        run: |
          for package in ./release-packages/*.tgz; do
            npm publish "$package" --access public --tag "$NPM_TAG"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.version.outputs.dist_tag }}
